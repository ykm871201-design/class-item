# Windows 설치 파일 자동 빌드
# main 브랜치에 코드가 올라오거나 Actions 탭에서 수동 실행(Run workflow)하면
# Windows에서 타입 검사·테스트·빌드 후, package.json의 version으로 Releases(v<version>)에 설치 파일을 올립니다.
# 같은 버전이면 기존 릴리스의 설치 파일을 새로 빌드한 것으로 바꿉니다. 새 버전을 내려면 version을 올리세요.
name: Windows 설치 파일 빌드

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tests-e2e/screenshots/**']
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 핵심 로직 테스트
        run: npm test
        env:
          TZ: Asia/Seoul

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 설치 파일 빌드
        run: |
          npm run build:prod
          npx electron-builder --win nsis --x64 --publish never

      - name: 실행 결과로 설치 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTools-Setup
          path: release/*.exe
          retention-days: 30

      - name: Releases에 설치 파일 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 교실 도구 v${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: release/*.exe
          body: |
            초등 교사용 Windows 교실 도구 앱입니다 (큰 글씨 칠판 · 수동/예약 타이머 · 랜덤 자리 배치 · 발표자 뽑기).

            ### 설치
            1. 아래 **Assets**에서 `ClassroomTools-Setup-*.exe`를 내려받아 실행합니다.
            2. 코드 서명이 없는 파일이라 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.

            사용법과 확인 절차는 저장소의 README를 참고하세요.
