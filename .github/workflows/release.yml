# Windows 설치 파일 자동 빌드
# - v로 시작하는 태그(예: v1.0.0)를 올리면: Windows에서 테스트·빌드 후 Releases에 설치 파일을 올립니다.
# - Actions 탭에서 수동 실행(Run workflow)하면: 빌드한 설치 파일을 실행 결과의 Artifacts에서 내려받을 수 있습니다.
name: Windows 설치 파일 빌드

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 핵심 로직 테스트
        run: npm test
        env:
          TZ: Asia/Seoul

      - name: 설치 파일 빌드
        run: |
          npm run build:prod
          npx electron-builder --win nsis --x64 --publish never

      - name: 실행 결과로 설치 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTools-Setup
          path: release/*.exe
          retention-days: 30

      - name: Releases에 설치 파일 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 교실 도구 ${{ github.ref_name }}
          files: release/*.exe
          body: |
            초등 교사용 Windows 교실 도구 앱입니다 (큰 글씨 칠판 · 수동/예약 타이머 · 랜덤 자리 배치 · 발표자 뽑기).

            ### 설치
            1. 아래 **Assets**에서 `ClassroomTools-Setup-*.exe`를 내려받아 실행합니다.
            2. 코드 서명이 없는 파일이라 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.

            사용법과 확인 절차는 저장소의 README를 참고하세요.
